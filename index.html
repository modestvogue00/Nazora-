<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Nazora – AI Job Hunter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f3f4f6;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--nv:#1e3a8a;--nvt:#fff;--sf:#eef2ff;--ok:#15803d;--wn:#b45309;--er:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mu:#94a3b8;--bd:#334155;--nv:#60a5fa;--nvt:#0f172a;--sf:#1e3a5f;--ok:#4ade80;--wn:#fbbf24;--er:#f87171;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#side{position:fixed;inset:0 auto 0 0;width:230px;background:var(--card);border-right:1px solid var(--bd);padding:16px 10px;overflow:auto;z-index:20;transition:transform .2s}
#side h1{font-size:18px;color:var(--nv);margin:4px 10px 14px}#side a{display:block;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:15px}
#side a.on{background:var(--nv);color:var(--nvt)}#side a.off{color:var(--mu);cursor:default}
#top{margin-left:230px;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 20px;display:flex;gap:10px;align-items:center}.sp{flex:1}#menu{display:none}
main{margin-left:230px;padding:20px;max-width:1000px}
@media(max-width:800px){#side{transform:translateX(-100%)}#side.open{transform:none}#top,main{margin-left:0}#menu{display:block}main{padding:14px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.big{font-size:28px;font-weight:700;color:var(--nv)}.mu{color:var(--mu);font-size:14px}h2{margin:0 0 12px;font-size:22px}h3{margin:0 0 8px;font-size:17px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px;min-height:40px;max-width:100%}
button{cursor:pointer}button.p{background:var(--nv);color:var(--nvt);border-color:var(--nv)}button.d{color:var(--er)}
textarea,.full{width:100%}textarea{min-height:140px}label{display:block;margin:8px 0 2px;font-size:14px;color:var(--mu)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;background:var(--sf);color:var(--nv);border:1px solid var(--bd)}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--nv)}
#mod{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#mod>div{background:var(--card);border-radius:14px;padding:18px;max-width:580px;width:100%;max-height:88vh;overflow:auto}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--nv);color:var(--nvt);padding:10px 16px;border-radius:10px;display:none;z-index:60;max-width:90%}
#login{max-width:360px;margin:12vh auto;padding:0 14px}.pre{white-space:pre-wrap;word-break:break-word}.tw{overflow-x:auto}
</style></head><body>
<div id="login" style="display:none"><div class="card"><h2>Nazora</h2><p class="mu">Private app. Sign in with your own account.</p>
<label>Email</label><input id="em" class="full" type="email" autocomplete="username"><label>Password</label><input id="pw" class="full" type="password" autocomplete="current-password">
<p id="lerr" class="er"></p><button class="p full" onclick="login()">Sign in</button></div></div>
<div id="app" style="display:none"><nav id="side"></nav><div id="top"><button id="menu" onclick="side.classList.toggle('open')" aria-label="Menu">☰</button><b class="sp" id="ttl"></b><button onclick="logout()">Sign out</button></div><main id="main"></main></div>
<div id="mod" onclick="if(event.target==this)this.style.display='none'"><div id="mb"></div></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Public (publishable) values only. Safe in the browser because Row Level Security protects the data.
const SB_URL='https://etviuphnmjzlqoyzdtkz.supabase.co',SB_KEY='sb_publishable_ezC_yq2ZwE5bTBKZDog4Fg_nBWQcs0g';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NP=v=>v?esc(v):'<span class="mu">Not provided</span>';
const ST=['Discovered','Under Review','Documents Ready','Awaiting Approval','Approved','Submitted','Interview','Rejected','No Response','Expired'];
const TX={en:{dash:'Dashboard',jobs:'Jobs',find:'Quick Search',appr:'Approval Center',trk:'Application Tracker',cv:'CV Manager',learn:'English Learning',src:'Sources',set:'Settings'},
id:{dash:'Dasbor',jobs:'Lowongan',find:'Cari Cepat',appr:'Pusat Persetujuan',trk:'Pelacak Lamaran',cv:'Manajer CV',learn:'Belajar Inggris',src:'Sumber',set:'Pengaturan'}};
const COMING=['Job Analysis (AI)','Scam Checker','Cover Letter (AI)'];
const NAV=['dash','find','jobs','appr','trk','cv','learn','src','set'];
const t=k=>(TX[P.language]||TX.en)[k]||k;
let U=null,P={language:'en',daily_goal:20,learning_mode:true},page='dash',JOBS=[],APPS=[];
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function modal(h){$('#mb').innerHTML=h;$('#mod').style.display='flex'}function closeM(){$('#mod').style.display='none'}
const fail=e=>{toast('Error: '+(e.message||e));console.error(e)};
async function boot(){const{data}=await sb.auth.getSession();
 if(!data.session){$('#login').style.display='block';$('#app').style.display='none';return}
 U=data.session.user;$('#login').style.display='none';$('#app').style.display='block';
 await sb.from('profiles').upsert({id:U.id},{ignoreDuplicates:true});
 const r=await sb.from('profiles').select('*').eq('id',U.id).single();if(r.data)P=r.data;go('dash')}
async function login(){$('#lerr').textContent='';const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 if(error){$('#lerr').textContent='Sign-in failed: '+error.message;return}boot()}
async function logout(){await sb.auth.signOut();location.reload()}
async function go(p){page=p;side.classList.remove('open');
 side.innerHTML='<h1>Nazora</h1>'+NAV.map(n=>`<a class="${n==p?'on':''}" onclick="go('${n}')">${t(n)}</a>`).join('')+COMING.map(c=>`<a class="off">${c} <span class="tag">soon</span></a>`).join('');
 $('#ttl').textContent=t(p);$('#main').innerHTML='<p class="mu">Loading…</p>';
 try{$('#main').innerHTML=await PG[p]()}catch(e){$('#main').innerHTML='<div class="card er">Could not load: '+esc(e.message)+'</div>'}scrollTo(0,0)}
async function loadJobs(){const r=await sb.from('jobs').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;JOBS=r.data}
async function loadApps(){const r=await sb.from('applications').select('*, jobs(title,company,source_url)').order('updated_at',{ascending:false});if(r.error)throw r.error;APPS=r.data}
const jc=j=>`<div class="card" style="cursor:pointer" onclick="jobDetail('${j.id}')"><b>${esc(j.title)}</b>${j.is_demo?' <span class="tag">DEMO</span>':''}<div class="mu">${esc(j.company)} · ${j.location?esc(j.location):'Location not provided'}</div>
<div class="row" style="margin-top:6px"><span class="tag">${j.arrangement||'arrangement not provided'}</span><span class="tag">${j.status}</span><span class="tag">Deadline: ${j.deadline||'Not provided'}</span></div></div>`;
const PG={
async dash(){await loadJobs();await loadApps();const [an]=await Promise.all([sb.from('job_analyses').select('id',{count:'exact',head:true})]);
 const today=new Date().toISOString().slice(0,10),n=s=>APPS.filter(a=>s.includes(a.status)).length,sub=APPS.filter(a=>a.status=='Submitted'&&a.submitted_at&&a.submitted_at.slice(0,10)==today).length;
 const m=[['Jobs Discovered',JOBS.length],['Jobs Analyzed',an.count||0],['Suitable Jobs','—'],['Ready for Review',n(['Awaiting Approval'])],['Approved',n(['Approved'])],['Submitted Today',sub]];
 return`<div class="grid">${m.map(x=>`<div class="card"><div class="mu">${x[0]}</div><div class="big">${x[1]}</div></div>`).join('')}</div>
 <div class="card"><h3>Daily goal: ${sub} / ${P.daily_goal}</h3><div class="bar"><i style="width:${Math.min(100,sub/P.daily_goal*100)}%"></i></div><p class="mu">A minimum goal, not a limit. Counts only applications you confirmed as submitted.</p></div>
 <div class="card mu">AI analysis is not connected yet, so “Analyzed” stays 0 and “Suitable Jobs” is empty. Nothing is estimated or faked.</div>
 <h3>Recent jobs</h3>${JOBS.slice(0,3).map(jc).join('')||'<p class="mu">No jobs yet. Add one in Jobs → Import.</p>'}`},
async jobs(){await loadJobs();return`<div class="row" style="margin-bottom:10px"><input id="q" class="sp" placeholder="Search title or company…" oninput="filt()"><button onclick="fetchRemote()">Fetch remote jobs</button><button class="p" onclick="importForm()">+ Import job</button></div><div id="jl">${JOBS.map(jc).join('')||'<div class="card mu">No jobs yet. Use “Import job” to paste a real vacancy.</div>'}</div>`},
async find(){return`<div class="card"><h3>Quick Search</h3><p class="mu">Opens each portal’s own search page in a new tab. You pick vacancies there; nothing is collected automatically.</p><label>Keyword</label><input id="kw" class="full" placeholder="admin, accounting…"><label>City</label><input id="ct" class="full" placeholder="Jakarta"><div class="row" style="margin-top:10px">${['LinkedIn','JobStreet','Indeed','Glints','Karir.com'].map(p=>`<button class="p" onclick="qs('${p}')">${p}</button>`).join('')}</div><p class="mu">Portal link formats can change. If one doesn’t work, search on the portal directly.</p></div>
<div class="card"><h3>Quick add</h3><p class="mu">Found a vacancy? Paste its link, title and company. It goes to your approval queue.</p><label>Link</label><input id="qa1" class="full" placeholder="https://…"><label>Job title</label><input id="qa2" class="full"><label>Company</label><input id="qa3" class="full"><br><button class="p" onclick="qadd()">Add to approval queue</button></div>`},
async appr(){await loadApps();const r=await sb.from('documents').select('id,title,kind').in('kind',['cv_original','cv_tailored']);const D=r.data||[];
 const L=APPS.filter(a=>a.status=='Awaiting Approval');
 const R=APPS.filter(a=>a.status=='Approved');const ready=`<h3 style="margin-top:18px">Approved: apply yourself, then confirm</h3>`+(R.map(a=>`<div class="card"><b>${esc(a.jobs.title)}</b> – ${esc(a.jobs.company)}<div class="row" style="margin-top:8px">${/^https?:\/\//i.test(a.jobs.source_url||'')?`<a href="${esc(a.jobs.source_url)}" target="_blank" rel="noopener noreferrer" style="padding:9px 12px;border:1px solid var(--bd);border-radius:10px;color:var(--nv)">Open original page</a>`:'<span class="mu">No link saved</span>'}<button class="p" onclick="chg('${a.id}','Submitted')">I submitted it</button></div></div>`).join('')||'<p class="mu">None yet.</p>');
 return (L.map(a=>`<div class="card"><b>${esc(a.jobs.title)}</b> – ${esc(a.jobs.company)}<div class="mu">Destination: ${NP(a.jobs.source_url)}</div>
 <label>CV for this application</label><select onchange="setCv('${a.id}',this.value)"><option value="">None selected</option>${D.map(d=>`<option value="${d.id}" ${a.cv_document_id==d.id?'selected':''}>${esc(d.title)}</option>`).join('')}</select>
 <div class="row" style="margin-top:10px"><button onclick="jobDetail('${a.job_id}')">Review job</button><button class="p" onclick="chg('${a.id}','Approved')">Approve</button><button class="d" onclick="chg('${a.id}','Rejected')">Reject</button><button onclick="toast('Kept in Awaiting Approval')">Save for later</button></div></div>`).join('')
 ||'<div class="card mu">Nothing is waiting for approval. Add jobs via Quick Search or Jobs.</div>')+ready},
async trk(){await loadApps();return`<div class="card mu">Approved and Submitted need your explicit confirmation. This app never sends applications; “Submitted” means you confirmed you sent it yourself.</div>
 <div class="card tw"><table style="width:100%;min-width:480px;border-collapse:collapse"><tr><th align="left">Position</th><th align="left">Company</th><th align="left">Status</th></tr>${APPS.map(a=>`<tr><td>${esc(a.jobs.title)}</td><td>${esc(a.jobs.company)}</td><td><select onchange="chg('${a.id}',this.value)">${ST.map(s=>`<option ${a.status==s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=3 class="mu">No applications yet. Open a job and tap “Add to tracker”.</td></tr>'}</table></div>`},
async cv(){const r=await sb.from('documents').select('*').order('created_at',{ascending:false});if(r.error)throw r.error;
 return`<div class="card"><h3>Upload a document</h3><select id="dk"><option value="cv_original">Original CV</option><option value="cv_tailored">Tailored CV</option><option value="cover_letter">Cover letter</option></select> <input id="df" type="file" accept=".pdf,.doc,.docx"> <button class="p" onclick="upDoc()">Upload</button><p class="mu">Stored in a private folder only your account can open.</p></div>
 ${r.data.map(d=>`<div class="card"><b>${esc(d.title)}</b> <span class="tag">${d.kind}</span><div class="mu">${new Date(d.created_at).toLocaleString()}</div><div class="row" style="margin-top:8px"><button onclick="dl('${d.id}','${esc(d.storage_path)}')">Download</button><button class="d" onclick="delDoc('${d.id}','${esc(d.storage_path)}')">Delete</button></div></div>`).join('')||'<p class="mu">No documents yet.</p>'}`},
async learn(){const r=await sb.from('saved_vocab').select('term');const S=new Set((r.data||[]).map(x=>x.term));
 const V=[['Strong','kuat / baik','Strong communication skills required.'],['Required','diwajibkan','Experience is required.'],['Applicant','pelamar','Each applicant must submit a CV.'],['Deadline','tenggat','The deadline is Friday.'],['Reconcile','merekonsiliasi','You will reconcile bank accounts.'],['Attention to detail','ketelitian','Attention to detail is essential.'],['Advantage','nilai tambah','Excel is an advantage.'],['Reside','berdomisili','Applicants must reside in Indonesia.']];
 return`<div class="card"><h3>Vocabulary</h3>${V.map(v=>`<div class="card" style="background:var(--sf)"><b>${v[0]}</b> = ${v[1]}<br><i class="mu">${v[2]}</i><br><button onclick="saveV('${v[0]}','${v[1]}','${v[2]}')">${S.has(v[0])?'★ Saved':'☆ Save'}</button></div>`).join('')}</div><p class="mu">Automatic translation of job descriptions needs the AI connection (coming later).</p>`},
async src(){const r=await sb.from('sources').select('*').order('id');return`<div class="card mu">Honest status: no source is “connected” unless it really is. Nothing is scraped; jobs come from what you import.</div>`+r.data.map(s=>`<div class="card"><b>${esc(s.name)}</b> <span class="tag">${s.status.replace('_',' ')}</span><div class="mu">${esc(s.status_note)}</div>${s.last_error?`<div class="er">${esc(s.last_error)}</div>`:''}</div>`).join('')},
async set(){return`<div class="card"><label>Language</label><select id="sl"><option value="en">English</option><option value="id" ${P.language=='id'?'selected':''}>Bahasa Indonesia</option></select>
 <label>Daily application target (minimum, no maximum)</label><input id="sg" type="number" min="1" value="${P.daily_goal}"><label class="row"><input id="sm" type="checkbox" ${P.learning_mode?'checked':''}> English Learning Mode</label><br><button class="p" onclick="saveSet()">Save</button></div>`}};
function qs(p){const k=encodeURIComponent($('#kw').value.trim()),c=encodeURIComponent($('#ct').value.trim());if(!k)return toast('Enter a keyword');
const L={LinkedIn:`https://www.linkedin.com/jobs/search/?keywords=${k}&location=${c}`,JobStreet:`https://id.jobstreet.com/jobs?keywords=${k}&where=${c}`,Indeed:`https://id.indeed.com/jobs?q=${k}&l=${c}`,Glints:`https://glints.com/id/opportunities/jobs/explore?keyword=${k}&country=ID`,'Karir.com':`https://karir.com/search-lowongan?keyword=${k}`};window.open(L[p],'_blank','noopener')}
async function qadd(){const url=$('#qa1').value.trim(),title=$('#qa2').value.trim(),company=$('#qa3').value.trim();
if(!title||!company)return toast('Title and company are required');if(url&&!/^https?:\/\//i.test(url))return toast('Link must start with http(s)://');
const key=[company,title,''].join('|').toLowerCase().replace(/\s+/g,' ');
const man=(await sb.from('sources').select('id').like('name','Manual%').limit(1)).data?.[0]?.id;let id;const d=await sb.from('jobs').select('id').eq('dedupe_key',key).limit(1);
if(d.data&&d.data.length){id=d.data[0].id}else{const r=await sb.from('jobs').insert({title,company,source_url:url||null,source_platform:'Manual import',dedupe_key:key,status:'unverified'}).select('id').single();if(r.error)return fail(r.error);id=r.data.id}
if(url)await sb.from('job_sources').upsert({job_id:id,source_id:man,source_url:url},{onConflict:'job_id,source_url'});
const a=await sb.from('applications').insert({job_id:id,status:'Awaiting Approval'});if(a.error&&a.error.code!='23505')return fail(a.error);
['qa1','qa2','qa3'].forEach(x=>$('#'+x).value='');toast(a.error?'Already in your queue':'Added to approval queue')}
async function fetchRemote(){toast('Fetching…');const r=await sb.functions.invoke('collect-remote-jobs');if(r.error)return fail(r.error);const d=r.data||{};toast(d.message||('New: '+d.added+', expired: '+d.expired));go('jobs')}
function filt(){const q=$('#q').value.toLowerCase();$('#jl').innerHTML=JOBS.filter(j=>(j.title+j.company).toLowerCase().includes(q)).map(jc).join('')||'<p class="mu">No match.</p>'}
function importForm(){modal(`<h3>Import a real job</h3><p class="mu">Copy the details from the original posting. Leave unknown fields empty (they show “Not provided”).</p>
<label>Job title *</label><input id="i1" class="full"><label>Company *</label><input id="i2" class="full"><label>Original link (URL)</label><input id="i3" class="full" placeholder="https://…"><label>Location</label><input id="i4" class="full">
<label>Arrangement</label><select id="i5"><option value="">Not provided</option><option value="remote">Remote</option><option value="hybrid">Hybrid</option><option value="onsite">On-site</option></select><label>Deadline</label><input id="i6" type="date"><label>Original description (paste as is)</label><textarea id="i7"></textarea>
<div class="row" style="margin-top:10px"><button onclick="closeM()">Cancel</button><button class="p" onclick="saveJob()">Save job</button></div>`)}
async function saveJob(){const v=i=>$('#i'+i).value.trim()||null,title=v(1),company=v(2);if(!title||!company)return toast('Title and company are required');
 let url=v(3);if(url&&!/^https?:\/\//i.test(url))return toast('Link must start with http:// or https://');
 const key=[company,title,v(4)||''].join('|').toLowerCase().replace(/\s+/g,' ');
 const man=(await sb.from('sources').select('id').like('name','Manual%').limit(1)).data?.[0]?.id;
 const dup=await sb.from('jobs').select('id,title').eq('dedupe_key',key).limit(1);
 if(dup.data&&dup.data.length){if(url)await sb.from('job_sources').upsert({job_id:dup.data[0].id,source_id:man,source_url:url},{onConflict:'job_id,source_url'});closeM();return toast('Duplicate: this job already exists (link added to it)')}
 const r=await sb.from('jobs').insert({title,company,source_url:url,source_platform:'Manual import',location:v(4),arrangement:v(5),deadline:v(6),description_original:v(7),dedupe_key:key,status:'unverified'}).select().single();
 if(r.error)return fail(r.error);if(url)await sb.from('job_sources').insert({job_id:r.data.id,source_id:man,source_url:url});closeM();toast('Saved');go('jobs')}
async function jobDetail(id){const j=JOBS.find(x=>x.id==id)||(await sb.from('jobs').select('*').eq('id',id).single()).data;const ls=(await sb.from('job_sources').select('source_url').eq('job_id',id)).data||[];
 modal(`<h3>${esc(j.title)}</h3><p class="mu">${esc(j.company)} · ${NP(j.location)}</p><div class="row"><span class="tag">${j.arrangement||'arrangement not provided'}</span><span class="tag">${j.status}</span><span class="tag">Deadline: ${j.deadline||'Not provided'}</span></div>
<p><b>Source link(s):</b><br>${ls.map(l=>/^https?:\/\//i.test(l.source_url)?`<a href="${esc(l.source_url)}" target="_blank" rel="noopener noreferrer">${esc(l.source_url)}</a>`:esc(l.source_url)).join('<br>')||'<span class="mu">Not provided</span>'}</p>
<p><b>Original description</b></p><div class="pre">${j.description_original?esc(j.description_original):'<span class="mu">Not provided</span>'}</div>
<p class="mu">Risk and match score: not assessed (AI analysis and scam checks are not connected yet).</p>
<div class="row" style="margin-top:10px"><button onclick="closeM()">Close</button><button class="p" onclick="addApp('${j.id}')">Add to approval queue</button><button class="d" onclick="delJob('${j.id}')">Delete</button></div>`)}
async function addApp(id){const r=await sb.from('applications').insert({job_id:id,status:'Awaiting Approval'});if(r.error)return toast(r.error.code=='23505'?'Already in tracker':r.error.message);closeM();toast('Added to tracker')}
async function delJob(id){if(!confirm('Delete this job and its related records?'))return;const r=await sb.from('jobs').delete().eq('id',id);if(r.error)return fail(r.error);closeM();go('jobs')}
async function setCv(id,v){const r=await sb.from('applications').update({cv_document_id:v||null}).eq('id',id);r.error?fail(r.error):toast('CV selected')}
async function chg(id,st){await loadApps();const a=APPS.find(x=>x.id==id);
 if(st=='Approved')return modal(`<h3>Authorize this application</h3><p>You approve <b>${esc(a.jobs.title)}</b> at <b>${esc(a.jobs.company)}</b>.</p><p class="mu">This only marks it approved. The app never sends anything; you send it yourself.</p><label class="row"><input type="checkbox" id="ck" onchange="$('#go').disabled=!this.checked"> I reviewed the job and my documents</label><div class="row" style="margin-top:10px"><button onclick="closeM();go(page)">Cancel</button><button id="go" class="p" disabled onclick="upd('${id}',{status:'Approved',approved_at:new Date().toISOString()})">Approve</button></div>`);
 if(st=='Submitted'){if(!a.approved_at){toast('Approve it first');return go(page)}return modal(`<h3>Confirm submission</h3><p>Only continue if you really submitted <b>${esc(a.jobs.title)}</b> yourself.</p><label class="row"><input type="checkbox" id="ck" onchange="$('#go').disabled=!this.checked"> Yes, I actually submitted it</label><div class="row" style="margin-top:10px"><button onclick="closeM();go(page)">Cancel</button><button id="go" class="p" disabled onclick="upd('${id}',{status:'Submitted',submitted_at:new Date().toISOString(),submission_confirmed_by_user:true})">Confirm</button></div>`)}
 if(['Interview','No Response'].includes(st)&&!a.approved_at){toast('Only after an approved application');return go(page)}
 upd(id,{status:st})}
async function upd(id,o){const r=await sb.from('applications').update(o).eq('id',id);closeM();if(r.error){fail(r.error);return go(page)}toast('Updated');go(page)}
async function upDoc(){const f=$('#df').files[0];if(!f)return toast('Choose a file');if(f.size>5e6)return toast('Max 5 MB');
 const path=`${U.id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g,'_')}`;const u=await sb.storage.from('documents').upload(path,f);if(u.error)return fail(u.error);
 const r=await sb.from('documents').insert({kind:$('#dk').value,title:f.name,storage_path:path});if(r.error)return fail(r.error);toast('Uploaded');go('cv')}
async function dl(id,path){const r=await sb.storage.from('documents').createSignedUrl(path,60);if(r.error)return fail(r.error);window.open(r.data.signedUrl,'_blank','noopener')}
async function delDoc(id,path){if(!confirm('Delete this document?'))return;await sb.storage.from('documents').remove([path]);const r=await sb.from('documents').delete().eq('id',id);r.error?fail(r.error):go('cv')}
async function saveV(a,b,c){const r=await sb.from('saved_vocab').upsert({user_id:U.id,term:a,translation:b,example:c},{onConflict:'user_id,term'});r.error?fail(r.error):(toast('Saved'),go('learn'))}
async function saveSet(){const o={language:$('#sl').value,daily_goal:Math.max(1,+$('#sg').value||20),learning_mode:$('#sm').checked};const r=await sb.from('profiles').update(o).eq('id',U.id);if(r.error)return fail(r.error);P={...P,...o};toast('Saved');go('set')}
boot();
</script></body></html>
